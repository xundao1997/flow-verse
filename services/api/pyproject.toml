[project]
name = "flowverse-api-service"
version = "0.0.0"
description = "FlowVerse non-business API service bootstrap"
requires-python = "==3.13.14"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "structlog==26.1.0",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["integration: requires explicitly configured external infrastructure"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
